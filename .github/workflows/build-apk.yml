name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoiceDialer.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceDialer-apk
          path: VoiceDialer.apk

      - name: Publish to "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Voice Dialer (latest build)
          body: "Built from ${{ github.sha }}. Download VoiceDialer.apk on your phone and install it."
          prerelease: false
          make_latest: true
          files: VoiceDialer.apk
